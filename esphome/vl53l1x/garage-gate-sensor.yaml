# Czujnik otwarcia bramy — VL53L1X (TOF400C) + ESP32 DevKit V1
# Spec: docs/superpowers/specs/2026-09-16-garage-gate-sensor-design.md
# Połączenia: docs/schematics/connections.pl.md
# Wariant równoległy: esphome/hc-sr04/

substitutions:
  device_name: garage-gate
  friendly_name: Garage Gate Sensor
  log_level: INFO
  # DevKit silkscreen: GPIO21 = D21, GPIO22 = D22
  pin_i2c_sda: GPIO21
  pin_i2c_scl: GPIO22
  # Kalibracja testowa w pokoju (ściana @ 3 m, full open @ 40 cm)
  # Po instalacji w garażu podmień na realne odczyty.
  clearance_full_open_mm: "400"    # full open @ 40 cm
  mount_offset_mm: "0"
  distance_closed_mm: "3000"       # full close @ 3,0 m (ściana)
  distance_open_mm: "400"          # ≈ clearance + mount (kontrola; nieużywane w %)
  open_threshold_percent: "10"
  close_threshold_percent: "5"
  max_open_seconds: "900"

external_components:
  - source: github://jasonwbarnett/esphome-vl53l1x-pololu
    components: [vl53l1x_pololu]

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
  level: ${log_level}

api:
  encryption:
    key: !secret gdos_sensor__api_key

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Fallback"
    password: "configure-me"

captive_portal:

# Diagnostyka widoczna w Home Assistant
debug:

globals:
  - id: last_good_raw_mm
    type: float
    restore_value: no
    initial_value: "0"
  - id: last_good_ms
    type: unsigned long
    restore_value: no
    initial_value: "0"
  - id: gate_is_open
    type: bool
    restore_value: no
    initial_value: "false"
  - id: open_since_ms
    type: unsigned long
    restore_value: no
    initial_value: "0"

i2c:
  sda: ${pin_i2c_sda}
  scl: ${pin_i2c_scl}
  scan: true
  # 50 kHz — delikatniej na długich/niepewnych przewodach (zalecenie komponentu)
  frequency: 50kHz

vl53l1x_pololu:
  distance_mode: long
  # 3–4 m: ST/Pololu zaleca ≥140 ms; przy słabej ścianie/świetle 200 bywa za mało
  timing_budget: 500ms
  inter_measurement: 550ms
  # Publish cadence (ranging itself runs continuously via inter_measurement)
  update_interval: 500ms

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    id: wifi_signal_db
    update_interval: 60s
    entity_category: diagnostic

  - platform: copy
    source_id: wifi_signal_db
    name: "WiFi Signal %"
    id: wifi_signal_pct
    entity_category: diagnostic
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "%"
    accuracy_decimals: 0

  - platform: uptime
    name: "Uptime"
    id: uptime_sensor
    update_interval: 60s
    entity_category: diagnostic

  - platform: internal_temperature
    name: "ESP Temperature"
    id: esp_temperature
    update_interval: 60s
    entity_category: diagnostic

  - platform: debug
    free:
      name: "Heap Free"
      id: heap_free
      entity_category: diagnostic
    block:
      name: "Heap Max Block"
      id: heap_max_block
      entity_category: diagnostic
    loop_time:
      name: "Loop Time"
      id: loop_time
      entity_category: diagnostic

  - platform: vl53l1x_pololu
    distance:
      id: gate_distance_raw
      name: "Gate Distance Raw"
      unit_of_measurement: "mm"
      accuracy_decimals: 0
      filters:
        # Poza zasięgiem VL53L1X często zwraca ~40 mm (minimum) zamiast błędu.
        # Nie odwołuj się tu do range_status — to samo platform → circular dependency.
        - lambda: |-
            if (x < 45.0f) return NAN;
            return x;
        - sliding_window_moving_average:
            window_size: 5
            send_every: 1
    range_status:
      name: "Gate Range Status"
      id: gate_range_status
      entity_category: diagnostic
    signal_rate:
      name: "Gate Signal Rate"
      id: gate_signal_rate
      entity_category: diagnostic
    ambient_rate:
      name: "Gate Ambient Rate"
      id: gate_ambient_rate
      entity_category: diagnostic
    frames:
      name: "Gate ToF Frames"
      id: gate_tof_frames
      entity_category: diagnostic
      filters:
        - throttle: 5min

  - platform: template
    name: "Gate Distance Effective"
    id: gate_distance_effective
    unit_of_measurement: "mm"
    accuracy_decimals: 0
    update_interval: 1s
    lambda: |-
      const float st = id(gate_range_status).state;
      if (!isnan(st) && (int) st != 0) return NAN;
      const float raw = id(gate_distance_raw).state;
      if (isnan(raw)) return NAN;
      id(last_good_raw_mm) = raw;
      id(last_good_ms) = millis();
      const float mount = atof("${mount_offset_mm}");
      return raw - mount;

  - platform: template
    name: "Gate Open Percent"
    id: gate_open_percent
    unit_of_measurement: "%"
    accuracy_decimals: 1
    update_interval: 1s
    lambda: |-
      const float st = id(gate_range_status).state;
      const bool bad_status = !isnan(st) && (int) st != 0;
      float raw = id(gate_distance_raw).state;
      if (isnan(raw) || bad_status) {
        if (millis() - id(last_good_ms) > 30000) return NAN;
        raw = id(last_good_raw_mm);
        if (raw <= 0.0f) return NAN;
      }
      const float mount = atof("${mount_offset_mm}");
      const float d_eff = raw - mount;
      const float d_closed_eff = atof("${distance_closed_mm}") - mount;
      const float d_open_eff = atof("${clearance_full_open_mm}");
      const float span = d_closed_eff - d_open_eff;
      if (span <= 0.0f) return NAN;
      float pct = 100.0f * (d_closed_eff - d_eff) / span;
      if (pct < 0.0f) pct = 0.0f;
      if (pct > 100.0f) pct = 100.0f;
      return pct;

  - platform: template
    name: "Gate Open Duration"
    id: gate_open_duration_s
    unit_of_measurement: "s"
    accuracy_decimals: 0
    update_interval: 1s
    lambda: |-
      if (!id(gate_is_open)) return 0.0f;
      return (millis() - id(open_since_ms)) / 1000.0f;

binary_sensor:
  - platform: status
    name: "Status"
    id: device_status
    entity_category: diagnostic

  - platform: template
    name: "Gate Open"
    id: gate_open
    device_class: garage_door
    lambda: |-
      return id(gate_is_open);

  - platform: template
    name: "Gate Open Too Long"
    id: gate_open_too_long
    lambda: |-
      if (!id(gate_is_open)) return false;
      const float max_s = atof("${max_open_seconds}");
      const float elapsed = (millis() - id(open_since_ms)) / 1000.0f;
      return elapsed > max_s;

text_sensor:
  - platform: version
    name: "ESPHome Version"
    id: esphome_version
    hide_timestamp: true
    entity_category: diagnostic

  - platform: wifi_info
    ip_address:
      name: "IP Address"
      id: wifi_ip
      entity_category: diagnostic
    ssid:
      name: "WiFi SSID"
      id: wifi_ssid_info
      entity_category: diagnostic
    bssid:
      name: "WiFi BSSID"
      id: wifi_bssid
      entity_category: diagnostic
    mac_address:
      name: "MAC Address"
      id: wifi_mac
      entity_category: diagnostic
    dns_address:
      name: "DNS Address"
      id: wifi_dns
      entity_category: diagnostic

  - platform: debug
    device:
      name: "Device Info"
      id: device_info
      entity_category: diagnostic
    reset_reason:
      name: "Reset Reason"
      id: reset_reason
      entity_category: diagnostic

  - platform: template
    name: "Gate Sensor Status"
    id: gate_sensor_status
    update_interval: 5s
    lambda: |-
      const float mount = atof("${mount_offset_mm}");
      const float d_closed_eff = atof("${distance_closed_mm}") - mount;
      const float d_open_eff = atof("${clearance_full_open_mm}");
      if ((d_closed_eff - d_open_eff) <= 0.0f) return std::string("invalid_calibration");
      const float st = id(gate_range_status).state;
      if (!isnan(st) && (int) st != 0) return std::string("out_of_range");
      const float raw = id(gate_distance_raw).state;
      if (isnan(raw) && (millis() - id(last_good_ms) > 30000)) return std::string("no_reading");
      return std::string("ok");

interval:
  - interval: 1s
    then:
      - lambda: |-
          const float pct = id(gate_open_percent).state;
          if (isnan(pct)) return;
          const float open_th = atof("${open_threshold_percent}");
          const float close_th = atof("${close_threshold_percent}");
          if (!id(gate_is_open) && pct >= open_th) {
            id(gate_is_open) = true;
            id(open_since_ms) = millis();
          } else if (id(gate_is_open) && pct <= close_th) {
            id(gate_is_open) = false;
          }
